<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS Arena - 01141133810</title>

    <style>
      :root {
        --bg: #050204;
        --panel: rgba(18, 4, 8, 0.75);
        --sunk: rgba(17, 21, 27, 0.85);
        --line: rgba(255, 50, 80, 0.3);
        --accent: #ff1a3c;
        --accent-glow: rgba(255, 26, 60, 0.5);
        --text-pink: #ff8598;
        --ok: #34d399;
        --bad: #f87171;
        --warn: #fbbf24;
        --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        background-color: var(--bg);
        color: #fff;
        font-family: var(--sans);
        overflow-x: hidden;
      }

      /* خلفية الصفحة مع طبقة التعتيم وتدرج PS Arena */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: 
          linear-gradient(180deg, rgba(9, 3, 6, 0.88) 0%, rgba(4, 1, 2, 0.93) 100%),
          url('ps4.png') no-repeat center center fixed;
        background-size: cover;
        z-index: 0;
        pointer-events: none;
      }

      /* الشريط العلوي */
      .system-bar {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 24px 0;
        padding: 12px 28px;
        background: var(--panel);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      .brand-badge {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-logo-custom {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px;
        filter: drop-shadow(0 0 10px rgba(255, 40, 70, 0.5));
      }

      .brand-logo-custom img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand-text-mini {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 50, 80, 0.6);
      }

      /* شريط قراءة الرام الحي (ramBox) */
      #ramBox {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 12px auto 0;
        padding: 6px 16px;
        border-radius: 12px;
        background: rgba(22, 5, 9, 0.7);
        border: 1px solid rgba(255, 50, 80, 0.2);
        color: var(--ok);
        font: 12px/1.4 var(--mono);
        text-align: center;
        text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* حاوية الصفحة الكلية */
      #main-layout {
        position: relative;
        z-index: 1;
        max-width: 1250px;
        margin: 0 auto;
        min-height: calc(100vh - 120px);
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* منطقة التحميل واللوجو في منتصف الصفحة */
      .center-loader-area {
        margin: auto 0;
        text-align: center;
        position: relative;
        height: 130px;
      }

      #spin {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 90px;
        height: 90px;
        margin: -45px 0 0 -45px;
        border: 4px solid rgba(255, 50, 80, 0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 10;
        background: rgba(18, 4, 8, 0.8);
        box-shadow: 0 0 25px var(--accent-glow);
      }

      #center-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        object-fit: contain;
        z-index: 11;
        filter: drop-shadow(0 0 10px rgba(255, 26, 60, 0.8));
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: absolute;
        top: calc(50% + 55px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--text-pink);
        display: none;
        z-index: 10;
        text-shadow: 0 0 10px rgba(255, 26, 60, 0.5);
      }

      #wrap {
        display: contents;
      }

      #state,
      #out {
        display: none;
      }

      /* حالات التشغيل */
      body.done #spin,
      body.done #center-logo,
      body.fail #spin,
      body.fail #center-logo {
        display: none;
      }

      body.fail #msg {
        display: block;
        color: var(--bad);
      }

      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 900;
        letter-spacing: 2px;
      }

      /* وضع السجل الكامل (?log=1) */
      body.log #spin,
      body.log #center-logo,
      body.log #msg,
      body.log .footer-grid-container {
        display: none;
      }

      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        margin-top: 10px;
      }

      body.log #state {
        display: block;
        font-size: 24px;
        font-weight: 900;
        margin: 0 0 10px;
        color: #fff;
      }

      body.log #out {
        display: block;
        flex: 1;
        white-space: pre-wrap;
        font: 13px/1.45 var(--mono);
        background: rgba(10, 2, 5, 0.35); /* خلفية شفافة جداً تظهر اللوجو والباك جراوند */
        backdrop-filter: blur(4px);        /* بلور خفيف جداً يخلي الخط واضح ومقروء */
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 50, 80, 0.25);
        border-radius: 16px;
        padding: 16px;
        height: calc(100vh - 170px);
        overflow-y: auto;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); /* ظل خفيف للكلام عشان يفضل باين وواضح */
      }
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid var(--bad);
        background: rgba(42, 20, 20, 0.9);
        color: #fca5a5;
        font: 700 18px/1.4 var(--sans);
        border-radius: 12px;
      }

      /* شبكة كروت العناوين والفروع (المربعات الستة) */
      .footer-grid-container {
        margin-top: auto;
        padding-top: 20px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 1050px;
        margin: 0 auto;
      }

      .info-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: linear-gradient(135deg, rgba(35, 6, 12, 0.75), rgba(15, 2, 5, 0.85));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        border: 1px solid rgba(255, 60, 85, 0.35);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .info-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }

      .icon-box {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 30, 60, 0.18);
        border: 1px solid rgba(255, 60, 90, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .icon-box svg {
        width: 18px;
        height: 18px;
        fill: #ff4d66;
        filter: drop-shadow(0 0 6px var(--accent));
      }

      .card-details {
        display: flex;
        flex-direction: column;
        text-align: right;
        width: 100%;
      }

      .card-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--text-pink);
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .card-main-text {
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.3;
      }

      .info-card.is-phone { direction: ltr; }
      .info-card.is-phone .card-details { text-align: left; }
      .info-card.is-phone .card-main-text {
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .byline-tag {
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.25);
        font-family: var(--mono);
        letter-spacing: 0.05em;
        margin-top: 10px;
      }

      @media (max-width: 1000px) {
        .info-grid { grid-template-columns: 1fr; max-width: 480px; }
      }

      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      code { color: #9fb3d0; }
    </style>
  </head>
